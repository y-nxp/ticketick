name: 🔑 Créer / réinitialiser un compte administrateur (GB10)

# Déclenchement manuel uniquement : cette opération donne accès à l'ensemble
# des données et n'a rien à faire dans un déploiement automatique.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse du compte administrateur (ex. vous@ticketick.ch)"
        required: true
        type: string
      nom:
        description: "Nom affiché dans le backoffice"
        required: false
        default: "Administrateur"
        type: string

concurrency:
  group: admin-account-gb10
  cancel-in-progress: false

jobs:
  create-admin:
    name: Compte administrateur sur BetaDev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔑 Créer le compte via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Le mot de passe passe par un secret : une entrée de workflow
          # apparaîtrait en clair dans l'interface et le journal du run.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_NAME: ${{ inputs.nom }}
        with:
          host: ${{ secrets.GB10_HOST }}
          username: ${{ secrets.GB10_USER }}
          key: ${{ secrets.GB10_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GB10_PORT }}
          envs: ADMIN_PASSWORD,ADMIN_EMAIL,ADMIN_NAME
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR="$HOME/ticketick-v2-betadev"

            echo "════════ Contrôles préalables ════════"

            if [ -z "${ADMIN_PASSWORD:-}" ]; then
              echo "✖ Le secret ADMIN_PASSWORD est absent."
              echo "  Le créer dans Settings → Secrets and variables → Actions."
              exit 1
            fi

            # Contrôlé ici en plus du script : mieux vaut refuser avant de
            # lancer un conteneur que d'échouer au milieu de l'opération.
            if [ "${#ADMIN_PASSWORD}" -lt 12 ]; then
              echo "✖ ADMIN_PASSWORD fait moins de 12 caractères."
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "✖ $APP_DIR est absent : déployer l'application d'abord."
              exit 1
            fi

            cd "$APP_DIR"
            echo "  Version déployée : $(git rev-parse --short HEAD)"
            echo "  Compte visé      : $ADMIN_EMAIL"

            echo "════════ Création ════════"

            # Exécuté dans l'image de build : elle porte le schéma Prisma et
            # tsx, absents de l'image d'exécution allégée.
            docker compose -f docker-compose.betadev.yml run --rm \
              -e ADMIN_EMAIL="$ADMIN_EMAIL" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              -e ADMIN_NAME="$ADMIN_NAME" \
              migrate npx tsx prisma/create-admin.ts

            echo "════════ Contrôle ════════"

            # Relecture indépendante : prouve que la ligne existe vraiment,
            # plutôt que de se fier au seul code de sortie du script.
            docker compose -f docker-compose.betadev.yml exec -T db \
              psql -U "$(grep -E '^POSTGRES_USER=' .env.betadev | cut -d= -f2)" \
                   -d "$(grep -E '^POSTGRES_DB=' .env.betadev | cut -d= -f2)" \
                   -qtc "SELECT '  ' || email || ' | ' || role || ' | actif=' || active FROM \"User\" WHERE role = 'ADMIN';"

            echo ""
            echo "✅ Connexion : https://appbetadev.ticketick.ch/login"
