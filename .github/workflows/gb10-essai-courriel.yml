name: ✉️ Contrôle des envois de courriel

# Répond à « je n'ai rien reçu ». La confirmation affichée à l'écran ne prouve
# rien : elle est volontairement identique que le compte existe ou non. Seules
# les traces du conteneur disent si un message est réellement parti.
#
# L'envoi n'est pas rejoué ici : nodemailer est empaqueté dans les bundles de
# Next et n'est pas résoluble depuis un script extérieur. On lit donc ce que
# l'application a elle-même journalisé.

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement à éprouver
        required: true
        type: choice
        options: [betadev, production]
        default: betadev
      destinataire:
        description: Adresse à rechercher dans les traces (facultatif)
        required: false
        type: string

jobs:
  essai:
    name: Essai SMTP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ✉️ Envoi depuis le conteneur
        uses: appleboy/ssh-action@v1.0.3
        env:
          CIBLE: ${{ inputs.environnement }}
          DEST: ${{ inputs.destinataire }}
        with:
          host: ${{ secrets.GB10_HOST }}
          username: ${{ secrets.GB10_USER }}
          key: ${{ secrets.GB10_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GB10_PORT }}
          envs: CIBLE,DEST
          command_timeout: 10m
          script: |
            set -euo pipefail

            if [ "$CIBLE" = "production" ]; then
              CONTENEUR="ticketick-v2-prod-app"
            else
              CONTENEUR="ticketick-v2-betadev-app"
            fi

            echo "🎯 Conteneur : $CONTENEUR"
            echo "📮 Adresse recherchée : ${DEST:-(toutes)}"
            echo

            # Présence des variables, sans jamais en afficher la valeur.
            docker exec "$CONTENEUR" sh -lc '
              for v in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM; do
                eval "val=\$$v"
                if [ -n "$val" ]; then
                  case "$v" in
                    SMTP_PASS) echo "   $v = (défini)" ;;
                    *)         echo "   $v = $val" ;;
                  esac
                else
                  echo "   $v = (VIDE)"
                fi
              done'
            echo

            # L'image est une sortie « standalone ». Next empaquette la plupart
            # des dépendances dans ses propres fichiers plutôt que de les
            # laisser dans node_modules : l'absence du dossier ne prouve donc
            # rien. On cherche les deux formes.
            echo "🔎 Où se trouve nodemailer :"
            docker exec "$CONTENEUR" sh -lc '
              echo "   — en tant que module :"
              find / -maxdepth 7 -type d -name nodemailer -path "*node_modules*" 2>/dev/null \
                | head -3 | sed "s/^/     /" || true
              echo "   — empaqueté par Next :"
              grep -rl "nodemailer" /app/.next/server 2>/dev/null | head -3 | sed "s/^/     /" || true' \
              || true
            echo

            # Sans jeton en base, l'absence d'erreur d'envoi ne prouverait
            # rien : cela voudrait dire que le parcours n'a pas été exécuté.
            echo "🔎 Demandes de réinitialisation enregistrées :"
            BDD="${CONTENEUR%-app}-db"
            PGU=$(docker exec "$BDD" printenv POSTGRES_USER)
            PGD=$(docker exec "$BDD" printenv POSTGRES_DB)
            docker exec "$BDD" psql -U "$PGU" -d "$PGD" -qtc \
              "SELECT '   ' || count(*) || ' jeton(s), dont '
                    || count(*) FILTER (WHERE \"usedAt\" IS NULL AND \"expiresAt\" > now())
                    || ' encore valable(s)' FROM \"PasswordResetToken\";" \
              || echo "   ⚠ Lecture impossible"
            echo

            echo "📜 Dernières traces de l'application (recherche d'échecs d'envoi) :"
            docker logs --tail 200 "$CONTENEUR" 2>&1 \
              | grep -iE "\[email|envoi impossible|réinitialisation|SMTP" \
              | tail -15 | sed 's/^/   /' || echo "   (aucune trace liée aux courriels)"
            echo

            echo "════════════════════════════════════════════"
            echo "  Une ligne « [email] … envoyé à … » ci-dessus atteste que"
            echo "  le serveur de messagerie a accepté le message."
            echo "  Une ligne « envoi impossible » signale l'inverse."
            echo "════════════════════════════════════════════"
