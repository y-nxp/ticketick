name: 🚧 Déployer la page d'attente (ticketick.ch)

# Page provisoire servie sur ticketick.ch le temps que la billetterie soit
# opérationnelle. Indépendante de l'application : un simple nginx statique.
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "mailer/**"
      - "nginx/**"
      - "docker-compose.landing.yml"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:
    inputs:
      message_test:
        description: "Envoyer un message de test à l'adresse de contact"
        type: boolean
        default: false

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur gb10
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Le port n'est pas un secret : surchargeable par une variable de
          # dépôt si le fournisseur n'utilise pas STARTTLS sur 587.
          SMTP_HOST: ${{ secrets.NOREPLY_HOST }}
          SMTP_PORT: ${{ vars.NOREPLY_PORT || '587' }}
          SMTP_USER: ${{ secrets.NOREPLY_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.NOREPLY_PASSWORD }}
          MAIL_TO: ${{ vars.CONTACT_TO }}
          # Certains fournisseurs authentifient sur un identifiant qui n'est pas
          # une adresse : dans ce cas renseigner la variable MAIL_FROM.
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.NOREPLY_USERNAME }}
          MESSAGE_TEST: ${{ inputs.message_test }}
        with:
          host: ${{ secrets.GB10_HOST }}
          username: ${{ secrets.GB10_USER }}
          key: ${{ secrets.GB10_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GB10_PORT }}
          # Variables transmises à la session distante.
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,MAIL_TO,MAIL_FROM,MESSAGE_TEST
          script: |
            set -euo pipefail

            # Contrôlé avant toute modification : si la configuration SMTP est
            # incomplète, le déploiement s'arrête sans toucher à la page en
            # ligne, plutôt que de publier un formulaire qui n'enverrait rien.
            MISSING=""
            for v in SMTP_HOST SMTP_USER SMTP_PASSWORD MAIL_TO; do
              eval "value=\${$v:-}"
              [ -n "$value" ] || MISSING="$MISSING $v"
            done
            if [ -n "$MISSING" ]; then
              echo "✖ Configuration du formulaire incomplète :$MISSING"
              echo "  Secrets attendus  : NOREPLY_HOST, NOREPLY_USERNAME, NOREPLY_PASSWORD"
              echo "  Variable attendue : CONTACT_TO (adresse de réception)"
              echo "  La page actuellement en ligne reste inchangée."
              exit 1
            fi

            APP_DIR="$HOME/ticketick-landing"
            REPO="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "📥 Récupération des sources ($BRANCH)..."
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO"
              git fetch --depth 1 origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              rm -rf "$APP_DIR"
              git clone --depth 1 --branch "$BRANCH" "$REPO" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Le réseau de NPM doit exister : sans lui le proxy ne pourrait pas
            # résoudre le conteneur, et un port publié serait nécessaire.
            NET="nginx-proxy-manager_default"
            if ! docker network inspect "$NET" > /dev/null 2>&1; then
              echo "✖ Réseau Docker '$NET' introuvable."
              echo "  Nginx Proxy Manager tourne-t-il toujours ? Réseaux existants :"
              docker network ls
              exit 1
            fi

            echo "🔐 Configuration du service de contact..."
            umask 077
            cat > .env.landing <<EOF
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            MAIL_FROM=${MAIL_FROM}
            MAIL_TO=${MAIL_TO}
            EOF
            # Le heredoc ci-dessus est indenté pour la lisibilité du workflow :
            # on retire cette indentation, sinon les clés seraient invalides.
            sed -i 's/^[[:space:]]*//' .env.landing

            echo "🚀 Démarrage des conteneurs..."
            docker compose -f docker-compose.landing.yml up -d --build --remove-orphans

            echo "⏳ Vérification..."
            OK=0
            for i in $(seq 1 12); do
              if docker exec ticketick-landing \
                   wget -q -O /dev/null http://127.0.0.1/ 2>/dev/null; then
                OK=1
                break
              fi
              sleep 3
            done

            if [ "$OK" -ne 1 ]; then
              echo "❌ La page ne répond pas — logs :"
              docker compose -f docker-compose.landing.yml logs --tail=40 || true
              exit 1
            fi

            # Le service éprouve la connexion SMTP au démarrage et en publie le
            # résultat : un conteneur vivant ne suffirait pas à prouver que les
            # identifiants sont bons.
            echo "✉ Service de contact :"
            # Le service éprouve le SMTP avant d'ouvrir son port : il faut donc
            # lui laisser le temps de répondre plutôt que l'interroger une fois.
            SMTP_STATE="unreachable"
            for i in $(seq 1 20); do
              SMTP_STATE=$(docker exec ticketick-landing-mailer node -e \
                "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(d=>console.log(d.smtp)).catch(()=>console.log('unreachable'))" \
                2>/dev/null || echo "unreachable")
              case "$SMTP_STATE" in
                ok | failed) break ;;
              esac
              sleep 3
            done

            # Le commit servi est affiché : sans lui, un filtre `paths` trop
            # étroit peut laisser croire qu'une correction est déployée alors
            # qu'aucun déploiement n'a été déclenché.
            echo "📌 Version servie : $(git rev-parse --short HEAD) — $(git log -1 --format=%s)"

            case "$SMTP_STATE" in
              ok)
                echo "   ✅ Connexion SMTP validée, formulaire opérationnel."
                ;;
              failed)
                echo "   ❌ Le service tourne mais le serveur SMTP refuse la connexion."
                echo "     Vérifier NOREPLY_HOST / NOREPLY_USERNAME / NOREPLY_PASSWORD"
                echo "     et la variable NOREPLY_PORT. Détail :"
                docker compose -f docker-compose.landing.yml logs --tail=20 mailer || true
                exit 1
                ;;
              *)
                echo "   ❌ Service injoignable — logs :"
                docker compose -f docker-compose.landing.yml logs --tail=30 mailer || true
                exit 1
                ;;
            esac

            # Contrôle depuis NPM lui-même : c'est lui qui devra joindre le
            # conteneur, une réponse ici valide donc le chemin réel.
            echo "🔎 Accès depuis Nginx Proxy Manager :"
            if docker exec nginx-proxy-manager-app-1 \
                 curl -sf -o /dev/null -w '   ↳ HTTP %{http_code} sur http://ticketick-landing/\n' \
                 http://ticketick-landing/ 2>/dev/null; then
              echo "   ✅ NPM atteint le conteneur."
            else
              echo "   ⚠ NPM ne joint pas encore le conteneur."
              echo "     Vérifier qu'il est bien sur le réseau $NET :"
              docker network inspect "$NET" \
                --format '{{range .Containers}}     - {{.Name}}{{println}}{{end}}'
            fi

            # La validation SMTP prouve l'authentification, pas l'acheminement
            # jusqu'à la boîte : seul un envoi réel le démontre. Emprunte le
            # même chemin qu'un visiteur, à travers nginx.
            if [ "${MESSAGE_TEST:-false}" = "true" ]; then
              echo "📨 Envoi d'un message de test vers ${MAIL_TO}..."
              CODE=$(docker exec ticketick-landing sh -c '
                wget -q -O /dev/null -S \
                  --header="content-type: application/json" \
                  --post-data="{\"name\":\"Test de déploiement\",\"email\":\"noreply@ticketick.ch\",\"subject\":\"Vérification du formulaire\",\"message\":\"Message de contrôle émis par le déploiement. Si vous le recevez, le formulaire de ticketick.ch est opérationnel.\"}" \
                  http://127.0.0.1/api/contact 2>&1 | grep -oE "HTTP/1.1 [0-9]+" | head -1
              ' || true)
              echo "   ↳ ${CODE:-aucune réponse}"
              case "$CODE" in
                *200) echo "   ✅ Message accepté. Vérifier la réception dans ${MAIL_TO}." ;;
                *429) echo "   ⚠ Quota atteint pour cette adresse IP : réessayer dans une heure." ;;
                *)    echo "   ❌ Envoi refusé — logs :"
                      docker compose -f docker-compose.landing.yml logs --tail=20 mailer || true ;;
              esac
            fi

            docker image prune -f --filter "until=24h" > /dev/null 2>&1 || true

            echo "════════════════════════════════════════════"
            echo "  ✅ Page d'attente déployée"
            echo "  🌐 https://ticketick.ch"
            echo "  ↳ NPM : Forward Hostname 'ticketick-landing', Port 80"
            echo "════════════════════════════════════════════"
