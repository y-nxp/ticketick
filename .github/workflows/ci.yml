name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Types · Build
    runs-on: ubuntu-latest
    env:
      # Valeur factice : le build n'a pas besoin d'une vraie base.
      DATABASE_URL: postgresql://user:pass@localhost:5432/ticketick?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
