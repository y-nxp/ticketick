# Mises à jour des dépendances (socle NXP) : une pull request regroupée par semaine pour les
# versions mineures et correctives ; les correctifs de sécurité arrivent tout de suite (réglage
# « Dependabot security updates » du dépôt). Copier dans .github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    labels: [dependances]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependances]
