# Page d'attente de ticketick.ch.
#
# Sert les fichiers statiques et relaie le seul point d'entrée dynamique
# (/api/contact) vers le service d'envoi, qui n'est pas exposé autrement.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le proxy en amont (Nginx Proxy Manager) termine déjà TLS.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header content-type text/plain;
    }

    location /api/contact {
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_pass http://mailer:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Transmet l'IP réelle : le service en a besoin pour limiter les envois.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;

        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Les SVG de marque changent rarement.
    location ~* \.svg$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
