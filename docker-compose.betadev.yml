# ============================================================
# ticketick — stack BetaDev sur gb10
# URL   : https://appbetadev.ticketick.ch
# Port  : 3005 côté hôte (Nginx Proxy Manager route vers ce port)
# Déployé par .github/workflows/deploy-betadev.yml (branche develop)
# ============================================================
# Le nom de projet est distinct de l'ancienne stack (`ticketick-betadev`)
# pour que les deux puissent tourner en parallèle le temps de la bascule.

name: ticketick-v2-betadev

services:
  db:
    image: postgres:16-alpine
    container_name: ticketick-v2-betadev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Volontairement non publié sur l'hôte : seul `app` y accède, via le réseau
    # Docker interne. Évite tout conflit de port avec les autres stacks de gb10.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Le conteneur de build de gb10 ne résout pas le DNS public (échec sur
      # dl-cdn.alpinelinux.org) : on lui prête la pile réseau de l'hôte.
      network: host
    container_name: ticketick-v2-betadev-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.betadev
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data:
